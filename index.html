<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens
   Exercise-book system: each qualification is a book-cover colour (the card
   spine), the calendar is a ruled page with a red margin line, overdue work is
   marked in "red pen". Everything else stays quiet.
   ========================================================================== */
:root{
  --paper:#ECEFF4; --lane:#E1E6EE; --sheet:#FFFFFF;
  --ink:#1B2A4A; --ink-2:#4A5775; --ink-3:#717D96;
  --rule:#D2D9E4; --rule-2:#E7EBF2; --ruling:#C8D6EC; --margin-line:#E3767B;
  --red:#C62F37; --red-soft:#FBE7E8;
  --amber:#8F5806; --amber-soft:#FCEFD6;
  --ok:#22704A; --ok-soft:#E2F1E8;
  --excused:#53638A;
  --hl:#FFEB7A; --today:#FFFAE3; --focus:#2260D3;
  --lift:0 14px 32px rgba(27,42,74,.20);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper)}
body.no-scroll{overflow:hidden}
body:not([data-state=app]) .app-only{display:none !important}
body[data-state=out] #account-menu{display:none !important}
.pw-row{display:flex;gap:6px}
.pw-row input{flex:1}
.auth-card .form-error{margin:0}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--focus);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--ink-3);font-weight:400}
.icon{width:16px;height:16px;flex:none}
.icon-xs{width:12px;height:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#AEB9CB}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#2A3D66;border-color:#2A3D66}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--rule-2);border-color:transparent}
.btn-quiet{background:var(--paper);border-color:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--lane);border-color:transparent;color:var(--ink)}
.btn-danger{color:var(--red);border-color:#F0C4C7}
.btn-danger:hover{border-color:var(--red)}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{padding:4px 8px;font-size:13px}
.btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

input[type=text],input[type=url],input[type=date],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input:hover,select:hover,textarea:hover{border-color:#AEB9CB}
textarea{resize:vertical;line-height:1.5}
select{cursor:pointer}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;padding:0;margin:0}
.field>label,.field>legend,.lbl{font-size:13px;font-weight:700;color:var(--ink-2);padding:0}
.hint{font-size:12.5px;color:var(--ink-3)}
.check-inline{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;white-space:nowrap}
.check-inline input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
.tag-q{background:#DDE3EC;color:var(--ink)}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(27,42,74,.18)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:var(--amber-soft);color:var(--amber)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
.badge-overdue{background:var(--red-soft);color:var(--red)}
.badge-soon{background:var(--amber-soft);color:var(--amber)}
.badge-cc{background:#E9EDF5;color:#3D4C70;border:1px dashed #9AA6BD}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tag-credit{background:#E3EDFB;color:#1E4FA8}
.count-pill{display:inline-flex;min-width:20px;justify-content:center;padding:0 6px;border-radius:10px;background:var(--rule-2);color:var(--ink-2);font-size:12px;line-height:18px}
.count-pill.hot{background:var(--red);color:#fff}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.nav{display:inline-flex;background:var(--paper);border-radius:8px;padding:3px}
.nav button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:700}
.nav button[aria-current=page]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(27,42,74,.14)}
.clock{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
#attention-btn[aria-pressed=true]{border-color:var(--red);color:var(--red);background:var(--sheet)}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-panel{position:absolute;right:0;top:calc(100% + 6px);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--lift);padding:6px;min-width:240px;z-index:30;display:flex;flex-direction:column}
.menu-panel button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.menu-panel button:hover{background:var(--paper)}
.menu-panel hr{border:0;border-top:1px solid var(--rule-2);margin:4px 0}
.menu-note{padding:6px 10px 8px;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid var(--rule-2);margin-bottom:4px;overflow-wrap:anywhere}
.acct-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 10px 3px 3px;border-radius:22px;border:1px solid var(--rule);background:var(--sheet)}
.acct-chip:hover{border-color:#AEB9CB}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:#fff;font-weight:700;font-size:13px;flex:none}
.acct-chip .avatar{width:28px;height:28px;font-size:11.5px}
.acct-text{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.acct-text strong{font-size:13.5px}
.acct-text span{font-size:11.5px;color:var(--ink-3)}

/* ---------- Sign-in & waiting screens ---------- */
.auth-wrap{min-height:calc(100vh - 62px);display:grid;place-items:center;padding:32px 16px}
.auth-card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:28px;width:min(440px,100%);display:grid;gap:14px}
.auth-card h1{font-size:24px;letter-spacing:-.01em}
.acct-list{display:grid;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.acct{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-bottom:1px solid var(--rule-2);background:#fff;text-align:left;cursor:pointer;width:100%}
.acct:last-child{border-bottom:0}
.acct:hover{background:var(--paper)}
.acct strong{display:block;font-size:14.5px}
.acct .muted{font-size:13px}
.signin-back{justify-self:start;margin:-8px 0 -4px -10px}
.acct.static{cursor:default;border:1px solid var(--rule);border-radius:10px}
.acct.static:hover{background:#fff}
.signin-form{display:grid;gap:14px}
body:not(.cloud) .cloud-only,body.cloud .local-only{display:none !important}
.auth-card .link-btn{justify-self:start;padding:0;border:0;background:none;color:var(--focus);font-weight:700;font-size:14px;cursor:pointer}
.auth-card fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.auth-card fieldset legend{font-weight:700;font-size:13.5px;margin-bottom:6px}
.auth-card .radio{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.auth-card .radio input{margin-top:3px}
.setup-progress{height:8px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.setup-progress i{display:block;height:100%;background:var(--ok);transition:width .2s}
.cloud-note{margin:12px 20px 0}
.add-acct{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-items:end;margin-top:10px;max-width:640px}
@media (max-width:760px){.add-acct{grid-template-columns:1fr}}

/* ---------- Board ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px 0}
.toolbar select{width:auto}
.search{position:relative;flex:0 1 300px;min-width:200px}
.search .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:31px}
.view-as{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-2)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:14px 20px 40px;align-items:start}
.col{background:var(--lane);border-radius:10px;display:flex;flex-direction:column;min-height:62vh;border:2px solid transparent;transition:border-color .12s}
.col.drop-target{border-color:var(--focus);border-style:dashed;background:#DCE5F3}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px}
.col-head h2{font-size:15px}
.col-body{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px;flex:1}
.col-empty{border:1.5px dashed #BFC8D6;border-radius:8px;padding:18px 14px;text-align:center;color:var(--ink-3);font-size:13.5px}
.card{position:relative;background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--qc);border-radius:6px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:#AFBACC;border-left-color:var(--qc)}
.card[draggable=true]{cursor:grab}
.card.dragging{opacity:.45}
.card.is-done .card-title{color:var(--ink-2)}
.card.selected{outline:2px solid var(--focus);outline-offset:-1px;background:#F3F7FF}
.select-tick{width:18px;height:18px;border:2px solid #9AA6BB;border-radius:4px;display:inline-grid;place-items:center;flex:none;background:#fff;color:#fff}
.card.selected .select-tick{background:var(--focus);border-color:var(--focus)}
.card-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.card-title{font-weight:700;font-size:15.5px;line-height:1.3}
.card-sub{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:13px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .icon{width:14px;height:14px;color:var(--ink-3)}
.progress{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);padding-top:6px;border-top:1px dashed var(--rule-2)}
.prog{display:inline-flex;align-items:center;gap:5px}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:2px;border:1.5px solid #A3AEC2;display:inline-block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.card-actions{display:flex;justify-content:space-between;gap:6px}
.who{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:12px;line-height:1.35;color:var(--ink-3)}
.who>span{display:block}
.who .icon{vertical-align:-2px;margin-right:4px}
.who strong{color:var(--ink-2)}
.who .who-completed .icon{color:var(--green, #2F8A57)}
.who .who-cc .icon{color:var(--red)}
.dr-head .who{margin-top:8px;font-size:13px}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--rule-2);align-items:baseline}
.hist-when{color:var(--ink-3);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist-by{font-weight:700;color:var(--ink-2);text-align:right}
.bulkbar{position:sticky;bottom:14px;z-index:15;margin:-24px 20px 20px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;box-shadow:var(--lift)}
.bulkbar select{width:auto;color:var(--ink)}
.bulk-count{font-weight:700;margin-right:4px}
.btn-onink{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn-onink:hover{border-color:#fff}
.bulk-move{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.bulk-move>span{font-size:13px;font-weight:700}
.col-sel{margin-left:auto;margin-right:6px}
.ev.pv{--pv:#6E5DBF;background:repeating-linear-gradient(135deg,#EEEBFA 0 6px,#F7F5FD 6px 12px);border:1px solid #CFC7EE;border-left:3px solid var(--pv);color:#3A2F78}
.ev.pv .ev-time{opacity:.8}
.pv-swatch{display:inline-block;width:12px;height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,#DCD5F5 0 3px,#F7F5FD 3px 6px);border:1px solid #B9AEE6;vertical-align:-2px}
.pv-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pv-presets .tchip{min-height:30px;padding:3px 11px;font-size:13px}
#pv-form .modal-body{display:flex;flex-direction:column;gap:14px}
#pv-form .modal-body .hint{margin:0}
#pv-warn:empty{display:none}
#pv-warn .notice{margin:0}
.checks li.warn{color:#8A5A00}
.btn-light{background:#fff;border-color:#fff;color:var(--ink)}
.btn-light:hover{background:#E8EDF6;border-color:#E8EDF6}

/* ---------- Calendar ---------- */
.cal-wrap{padding:14px 20px 40px}
.cal-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.cal-toolbar select{width:auto}
.cal-title{font-size:20px;margin:0 6px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--ink-2);font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .free-swatch{border:1.5px dashed #8EA8D2;background:repeating-linear-gradient(135deg,rgba(34,96,211,.12) 0 3px,transparent 3px 6px)}
.legend .hint{margin-left:auto}
.flag{flex:none;width:8px;height:8px;border-radius:50%;background:var(--red)}
.flag.soon{background:#D99413}

.tg{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:auto;max-height:calc(100vh - 200px);min-height:420px}
.tg-inner{display:grid;min-width:fit-content}
.tg-head{position:sticky;top:0;z-index:3;background:var(--sheet);border-bottom:1px solid var(--rule);border-left:1px solid var(--rule-2);padding:8px 10px;font-size:13px;text-align:left;min-width:0}
button.tg-head{border-top:0;border-right:0;cursor:pointer;font:inherit;font-size:13px;color:var(--ink-2)}
button.tg-head:hover{background:#F6F8FB}
.tg-head strong{font-size:16px;color:var(--ink);margin-left:3px}
.tg-head.today{background:var(--today)}
.tg-head.today strong{background:var(--hl);padding:0 5px;border-radius:4px}
.tg-person{display:flex;flex-direction:column;gap:1px}
.tg-person strong{margin:0;font-size:14px}
.tg-person span{font-size:12px;color:var(--ink-3)}
.tg-corner{left:0;z-index:5;border-left:0;font-size:11px;color:var(--ink-3);display:flex;align-items:flex-end}
.tg-gutter{position:sticky;left:0;z-index:2;background:var(--sheet);border-right:2px solid var(--margin-line)}
.tg-hour{position:absolute;right:8px;font-size:11.5px;color:var(--ink-3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tg-hour:first-child{transform:none;top:2px !important}
.tg-hour.half{font-size:10.5px;color:#9AA4B6}
.tg-col{position:relative;border-left:1px solid var(--rule-2);background-image:linear-gradient(to bottom,var(--ruling) 1px,transparent 1px),linear-gradient(to bottom,var(--rule-2) 1px,transparent 1px);background-size:100% var(--hh),100% var(--hh);background-position:0 0,0 calc(var(--hh) / 2)}
.tg-col.today{background-color:var(--today)}
.tg-col.can-add{cursor:copy}
.ev{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;border-left:4px solid color-mix(in srgb,var(--qc) 62%,#000);border-radius:5px;background:var(--qc);padding:3px 6px;font-size:12px;line-height:1.25;text-align:left;overflow:hidden;cursor:pointer;color:var(--qt);box-shadow:0 0 0 1px rgba(255,255,255,.9)}
.ev:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.07),0 0 0 1px #fff}
.ev strong{font-size:12.5px}
.ev-time{font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.ev-sub{opacity:.85}
.ev.cc{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--qc) 30%,#fff) 0 5px,#fff 5px 10px);color:var(--ink);border-left-style:dashed;opacity:.92}
.ev.cc .ev-time,.ev.cc .ev-sub{opacity:.75}
.ev .flag{position:absolute;top:4px;right:4px;box-shadow:0 0 0 1.5px #fff}
.free{position:absolute;left:4px;right:4px;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1.5px dashed #8EA8D2;border-radius:5px;background:repeating-linear-gradient(135deg,rgba(34,96,211,.07) 0 6px,transparent 6px 12px);color:#1E4FA8;font-size:12px;padding:3px 7px;text-align:left;overflow:hidden}
button.free{cursor:pointer}
button.free:hover{background:rgba(34,96,211,.12);border-color:var(--focus)}
.free strong{font-size:12px}
.free-add{font-weight:700}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.mt-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.mt-bar select{width:auto}
.mt-stats{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.mt-stats .bad{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;font-weight:700}
.mt-stats .bad button{border:0;background:none;padding:0;color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.tchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 10px}
.tchips-l{font-size:13px;font-weight:700;color:var(--ink-2);margin-right:2px}
.tchip{--tc:#5B6B86;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:34px}
.tchip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc)}
.tchip.all::before{display:none}
.tchip[aria-pressed=true]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--ink)}
.tchip.all[aria-pressed=true]{border-color:var(--ink-2);background:var(--paper)}
.tchips .hint{margin-left:4px}
.tg-person{border-top:3px solid var(--tc,transparent)}
.mg{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:auto;max-height:calc(100vh - 230px);min-height:420px;-webkit-overflow-scrolling:touch}
.mg-inner{display:grid;min-width:fit-content}
.mg-corner{position:sticky;left:0;top:0;z-index:6;background:var(--sheet);border-bottom:1px solid var(--rule);border-right:2px solid var(--margin-line);font-size:11px;color:var(--ink-3);display:flex;align-items:flex-end;padding:0 6px 6px}
.mg-day{position:sticky;top:0;z-index:4;height:36px;display:flex;align-items:center;gap:4px;border:0;border-left:1px solid #C6CFDC;border-bottom:1px solid var(--rule);background:var(--sheet);padding:0 8px;font-size:12.5px;color:var(--ink-2);text-align:left;cursor:pointer;white-space:nowrap;min-width:0}
.mg-day strong{font-size:15px;color:var(--ink)}
.mg-day.wkend{background:#FAFBFD}
.mg-day.today{background:var(--today)}
.mg-day.today strong{background:var(--hl);padding:0 5px;border-radius:4px}
.mg-day.wk,.mg-tutor.wk,.mg-col.wk,.mg-note.wk{border-left:2px solid #A9B5C8}
.mg-day .flag{margin-left:auto}
.mg-tutor{position:sticky;top:36px;z-index:4;height:22px;display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--sheet);border-left:1px solid var(--rule-2);border-bottom:1px solid var(--rule);border-top:3px solid var(--tc);font-size:11.5px;font-weight:700;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mg-tutor.dstart,.mg-col.dstart,.mg-note.dstart{border-left:1px solid #C6CFDC}
.mg-tutor.today{background:var(--today)}
.mg-gutter{position:sticky;left:0;z-index:3;background:var(--sheet);border-right:2px solid var(--margin-line)}
.mg-col{position:relative;border-left:1px solid var(--rule-2);background-image:linear-gradient(to bottom,var(--ruling) 1px,transparent 1px),linear-gradient(to bottom,var(--rule-2) 1px,transparent 1px);background-size:100% var(--hh),100% var(--hh);background-position:0 0,0 calc(var(--hh) / 2)}
.mg-col.today{background-color:var(--today)}
.mg-closed{position:absolute;left:0;right:0;background:rgba(236,239,244,.75)}
.mg-free{left:2px;right:2px;padding:2px 4px;font-size:10.5px;line-height:1.15}
.mg-free strong{font-size:10.5px}
.mg-free.past{opacity:.45}
.mg-ev{padding:2px 4px;font-size:10.5px;line-height:1.15;border-left-width:3px}
.mg-ev strong{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-ev .ev-time{font-size:10px}
.mg-ev .ev-sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-ev.clash{z-index:2;box-shadow:0 0 0 1px #fff,0 0 0 2.5px var(--red)}
.mg-ghost{left:auto !important;right:2px;width:42%;z-index:1}
.mg-ev .flag{width:6px;height:6px;top:3px;right:3px}
.mg-note-l{position:sticky;left:0;z-index:3;background:var(--paper);border-top:2px solid var(--rule);border-right:2px solid var(--margin-line);font-size:12px;font-weight:700;color:var(--ink-2);padding:8px 6px}
.mg-note{border-top:2px solid var(--rule);border-left:1px solid var(--rule-2);background:var(--paper);padding:4px;min-height:72px}
.mg-note.today{background:color-mix(in srgb,var(--today) 70%,var(--paper))}
.mg-note textarea{width:100%;min-height:64px;resize:vertical;font-size:12px;line-height:1.3;padding:4px 5px;border-radius:5px;border:1px solid var(--rule);background:#fff}
.mg-note textarea:placeholder-shown{background:transparent;border-style:dashed}
.mg-note p{margin:0;font-size:12px;line-height:1.3;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.cal-jump{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--sheet);border:1.5px dashed #BFC8D6;border-radius:10px;padding:10px 14px;margin-bottom:10px;color:var(--ink-2);font-size:14px}
.cal-empty{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:40px;text-align:center;color:var(--ink-3)}

/* ---------- Billing ---------- */
.bill-wrap{padding:14px 20px 48px;max-width:1440px}
.bill-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.bill-head h2{font-size:20px;margin-right:6px}
.bill-note{color:var(--ink-2);font-size:14px;margin-bottom:14px}
.table-card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:auto}
.bill-table{width:100%;border-collapse:collapse;font-size:14.5px}
.bill-table th,.bill-table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.bill-table th{font-size:12.5px;color:var(--ink-3);background:#F7F9FC}
.bill-table tfoot td{font-weight:700;border-bottom:0;background:#F7F9FC}
.num{text-align:right !important;font-variant-numeric:tabular-nums}
.bill-head .seg{margin-left:4px}
.bill-tools{display:flex;gap:10px;margin:0 0 10px}
.bill-tools .search{flex:0 1 280px}
.bill-table th .muted{font-weight:400}
.breakdown{margin-top:18px;display:grid;gap:8px}
.breakdown h3{font-size:16px;margin-bottom:2px}
.breakdown details{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.breakdown summary{padding:10px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.breakdown summary .muted{font-weight:400}
.breakdown .bill-table{font-size:14px;border-top:1px solid var(--rule-2)}
.bill-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--ok);cursor:pointer;vertical-align:middle}
.bill-table .paid-cell{display:flex;align-items:center;gap:6px}
.bill-table .paid-cell small{color:var(--ink-3);font-size:12px}
.credit-in{color:#1E4FA8;font-weight:700}

/* ---------- Pay slips and receipts: A5 sheets, printed or saved as PDF ---------- */
.doc-view{position:fixed;inset:0;z-index:70;background:#5E6778;overflow:auto;display:flex;flex-direction:column}
.doc-toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:0 2px 10px rgba(27,42,74,.12)}
.doc-toolbar h2{font-size:16px;margin:0 6px 0 2px}
.doc-step{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.doc-toolbar .check-inline{font-size:14px}
.doc-toolbar .doc-paid-toggle{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;cursor:pointer}
.doc-toolbar .doc-paid-toggle input{width:18px;height:18px;accent-color:var(--ok)}
.doc-toolbar .doc-paid-toggle.on{background:var(--ok-soft);border-color:#A9D3BB;color:var(--ok)}
.doc-hint{width:100%;font-size:13px;color:var(--ink-2);margin:0}
.doc-pages{display:grid;justify-content:center;gap:18px;padding:22px 16px 48px}
.a5{width:148mm;min-height:210mm;padding:10mm 10.5mm 8mm;background:#fff;color:#14203A;font-size:9pt;line-height:1.38;box-shadow:0 8px 26px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:3mm}
.a5 .num{text-align:right;font-variant-numeric:tabular-nums}
.doc-head{display:flex;justify-content:space-between;gap:6mm;padding-bottom:3mm;border-bottom:.6mm solid #14203A}
.doc-brand{font-size:19pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.doc-addr{font-size:7.6pt;color:#4A5775;margin-top:1.4mm;white-space:pre-line}
.doc-title{text-align:right}
.doc-title h1{font-size:12.5pt;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1.5mm;color:#14203A}
.doc-title dl{display:grid;grid-template-columns:auto auto;gap:.3mm 3mm;margin:0;font-size:8pt;justify-content:end}
.doc-title dt{color:#717D96}.doc-title dd{margin:0;font-weight:700}
.doc-parties{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.doc-parties>div{display:grid;gap:.4mm}
.doc-parties strong{font-size:11pt}
.doc-parties span:not(.doc-label){color:#4A5775;font-size:8.2pt}
.doc-label{font-size:7pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#717D96}
.doc-h{font-size:7.4pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#717D96;margin:1mm 0 -2.4mm}
.doc-sum,.doc-lines{width:100%;border-collapse:collapse}
.doc-sum td{padding:1.05mm 0;border-bottom:.2mm solid #E1E6EE}
.doc-sum tr.sub td{border-top:.3mm solid #B8C2D3;font-weight:700}
.doc-sum tr.total td{border-top:.5mm solid #14203A;border-bottom:0;font-weight:700;font-size:10.5pt;padding-top:1.8mm}
.doc-sum tr.credit td{color:#1E4FA8;font-weight:700}
.doc-sum tr.minus td{color:#4A5775}
.doc-lines th{font-size:7pt;text-transform:uppercase;letter-spacing:.06em;color:#717D96;text-align:left;padding:1mm 1.2mm 1mm 0;border-bottom:.3mm solid #B8C2D3}
.doc-lines td{padding:.55mm 1.2mm .55mm 0;border-bottom:.2mm solid #EDF0F5;font-size:7.8pt;line-height:1.25;vertical-align:top}
.doc-cols{display:grid;grid-template-columns:1fr 1fr;gap:5mm;align-items:start}
.doc-cols>div{display:grid;gap:1.4mm}
.doc-cols .doc-h{margin:0}
.doc-lines tr{break-inside:avoid}
.doc-lines .st{font-size:7.4pt;color:#4A5775}
.doc-lines .st.late{color:#8F5806}.doc-lines .st.credit{color:#1E4FA8}
.doc-note{font-size:7.8pt;color:#4A5775;margin:0}
.doc-paid{display:flex;align-items:center;gap:3mm;padding:2.2mm 3mm;border:.3mm solid #B8C2D3;border-radius:1.6mm;margin-top:auto;break-inside:avoid}
.doc-paid .box{width:5.4mm;height:5.4mm;border:.45mm solid #14203A;border-radius:.8mm;display:grid;place-items:center;font-size:10pt;font-weight:700;flex:none}
.doc-paid.on{border-color:#22704A;background:#F1F8F4}
.doc-paid.on .box{border-color:#22704A;color:#fff;background:#22704A}
.doc-paid strong{font-size:10pt}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-top:3mm;font-size:7.8pt;color:#4A5775;break-inside:avoid}
.doc-sign div{border-top:.3mm solid #14203A;padding-top:1.2mm}
.doc-foot{font-size:7.4pt;color:#717D96;margin:0;border-top:.2mm solid #E1E6EE;padding-top:2mm}
@media (max-width:640px){
  .doc-pages{padding:14px 8px 40px}
  .doc-pages .a5{zoom:.62}
}
@page{size:A5 portrait;margin:0}
@media print{
  body.doc-open{background:#fff}
  body.doc-open>*:not(#doc-root){display:none !important}
  body.doc-open #doc-root .doc-toolbar{display:none !important}
  body.doc-open .doc-view{position:static;overflow:visible;background:none;display:block}
  body.doc-open .doc-pages{display:block;padding:0}
  body.doc-open .a5{box-shadow:none;margin:0;width:148mm;min-height:209mm;zoom:1;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.doc-open .a5:last-child{break-after:auto}
}

/* ---------- Drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(27,42,74,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--sheet);z-index:41;display:flex;flex-direction:column;box-shadow:-14px 0 36px rgba(27,42,74,.2);border-top:6px solid var(--qc)}
.drawer.enter{animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(36px);opacity:.4}to{transform:none;opacity:1}}
.drawer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 10px 22px;border-bottom:1px solid var(--rule-2)}
.drawer-body{overflow:auto;padding:16px 22px 40px;flex:1}
.dr-head h2{font-size:22px;letter-spacing:-.01em}
.dr-subject{color:var(--ink-2);margin-top:2px}
.facts{display:grid;gap:6px;margin:14px 0}
.facts div{display:flex;gap:10px;align-items:flex-start}
.facts dt{color:var(--ink-3);padding-top:2px}
.facts dd{margin:0}
.warn-text{color:var(--red);font-weight:700}
.alerts{display:grid;gap:8px;margin-top:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:14px}
.alert strong{display:block}
.alert-overdue{background:var(--red-soft);color:#8E1C22;border-left:4px solid var(--red)}
.alert-cc{background:var(--paper);color:var(--ink-2);border-left:4px dashed #9AA6BD}
.alert-soon{background:var(--amber-soft);color:#6E4304;border-left:4px solid #D99413}
.section{padding:18px 0;border-bottom:1px solid var(--rule-2)}
.section:last-of-type{border-bottom:0}
.section h3{font-size:16px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.section h3 .muted{font-size:13px}
.checklists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cl{border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.cl h4{font-size:13.5px;margin-bottom:4px;color:var(--ink-2)}
.cl-item{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.cl-item input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ok);flex:none;cursor:pointer}
.cl-item input:disabled{cursor:not-allowed}
.cl-item label{cursor:pointer;font-size:14.5px}
.cl-item small{display:block;color:var(--ink-3);font-size:12px}
.cl-item.late label{color:var(--red);font-weight:700}
.att-summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.att-pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--rule-2);color:var(--ink-2)}
.att-summary .btn{margin-left:auto}
.att-list{list-style:none;margin:0;padding:0}
.att-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--rule-2)}
.att-row:last-child{border-bottom:0}
.att-name{font-weight:700}
.att-opts{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.att-opts button{border:0;border-right:1px solid var(--rule);background:#fff;padding:5px 9px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.att-opts button:last-child{border-right:0}
.att-opts button:hover:not(:disabled){background:var(--paper)}
.att-opts button:disabled{cursor:not-allowed}
.att-opts button[aria-pressed=true][data-status=present]{background:var(--ok);color:#fff}
.att-opts button[aria-pressed=true][data-status=late]{background:#D99413;color:#2B1A00}
.att-opts button[aria-pressed=true][data-status=absent]{background:var(--red);color:#fff}
.att-opts button[aria-pressed=true][data-status=excused]{background:var(--excused);color:#fff}
.empty-note{color:var(--ink-3);font-size:14px}
#notes{min-height:110px}
.cc-list{list-style:none;margin:0;padding:0}
.cc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0;border-bottom:1px dashed var(--rule-2)}
.cc-row:last-child{border-bottom:0}
.cc-row .check-inline{font-weight:700;white-space:normal}
.cc-row.cc-tutor{border-bottom:1.5px solid var(--rule)}
.cc-row.cc-tutor.on{background:var(--amber-soft);border-radius:6px;padding:8px}
.busy-note{color:var(--red);font-size:12.5px;font-weight:700;text-align:right}
.dup-note{display:flex;gap:6px;align-items:flex-start;margin:6px 0 10px;padding:8px 10px;border-radius:7px;background:var(--amber-soft);color:#6E4304;font-size:13px;line-height:1.35}
.picker-results .dup-note{margin:0;border-radius:0}
.rate-sum{font-size:13.5px;margin-bottom:4px;white-space:nowrap}
.rate-row>td{background:var(--paper);padding:10px 12px 14px}
.rates-grid{max-width:720px}
.rate-tbl{background:var(--sheet)}
.rate-tbl th[scope=row]{font-weight:700;white-space:nowrap}
.rate-tbl .rate-default th,.rate-tbl .rate-default td{border-bottom:1.5px solid var(--rule)}
.rate-tbl .rate-own th{color:#1E4FA8}
.rate-tbl .rate-in input{width:110px}
.rate-tbl th,.rate-tbl td{background:var(--sheet)}
.rate-tbl input{color:var(--ink);font-weight:700}
.rate-tbl input::placeholder{color:#AEB7C6;font-weight:400}
.rate-price{font-weight:700;font-variant-numeric:tabular-nums}
.cc-when{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.cc-when input,.cc-when select{width:auto;padding:4px 6px}
.mat-list{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.mat-list li{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--rule);border-radius:7px}
.mat-list a{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-list .muted{font-size:12px}
.mat-form{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px}
.msg-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:8px}
#msg-text{font-size:14px;min-height:220px;background:#FBFCFE}
.danger-zone{padding-top:18px}

/* ---------- Modals ---------- */
.modal-back{position:fixed;inset:0;background:rgba(27,42,74,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.confirm-back{z-index:60;align-items:center}
.modal{background:var(--sheet);border-radius:12px;width:min(820px,100%);box-shadow:var(--lift);display:flex;flex-direction:column}
.modal-wide{width:min(1000px,100%)}
.modal-sm{width:min(440px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule)}
.modal-head h2{font-size:19px}
.modal-body{padding:18px 20px}
.modal-body p+p{margin-top:8px}
.h-sm{font-size:18px;margin-bottom:8px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--rule);background:var(--sheet);border-radius:0 0 12px 12px;position:sticky;bottom:0}
.cf-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.cf-main{display:grid;gap:13px}
.cf-side{position:sticky;top:12px;background:var(--paper);border-radius:10px;padding:14px;font-size:14px}
.cf-side h3{font-size:15px;margin-bottom:4px}
.cf-side h4{font-size:13.5px;margin:14px 0 6px}
.avail-when{color:var(--ink-2);margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:7px;align-items:flex-start;line-height:1.35}
.checks li .icon{margin-top:1px}
.checks .good{color:var(--ok)}
.checks .bad,.bad{color:var(--red)}
.checks .neutral{color:var(--ink-3)}
.good-note{color:var(--ok);margin-top:8px}
.slotchips{display:flex;flex-wrap:wrap;gap:6px}
.slotchips button{border:1px solid #9FB3D6;background:#fff;color:#1E4FA8;border-radius:5px;padding:4px 8px;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.slotchips button:hover{background:#EAF0FB}
.slotchips button.on{background:#1E4FA8;color:#fff;border-color:#1E4FA8}
.mode{flex-direction:row;flex-wrap:wrap;gap:6px 16px;align-items:center}
.mode legend{width:100%;margin-bottom:5px}
.radio{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.radio input{accent-color:var(--ink);width:16px;height:16px;margin:0}
.stu-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:24px;align-items:center;font-size:13.5px}
#cf-stu-add{font-weight:600}
.new-stu{display:flex;gap:6px;margin-top:6px}
.new-stu input{flex:1}
.lp-box{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:12px 14px;margin-bottom:14px}
.lp-box h3{font-size:15px;margin:0 0 8px}
.lp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px}
.lp-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 4px}
.lp-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:13.5px;font-weight:600}
.lp-row .muted{font-weight:400;font-size:12px}
.lp-row .rate-in input{width:96px}
@media (max-width:760px){ .lp-grid{grid-template-columns:1fr} }
.rate-default{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px;font-size:13.5px;font-weight:700}
.rate-default label{display:inline-flex;gap:8px;align-items:center}

<script>
'use strict';
/* ==========================================================================
   Class Planner, stage 2: roles and permissions
   --------------------------------------------------------------------------
   The local database below has the same collections as Firestore, and every
   read and write passes through Rules, a line-for-line copy of
   firestore.rules. So a tutor is blocked by the data layer itself, not just by
   hidden buttons. Once on Firebase, firestore.rules does this on the server.

   users/{uid}               Google account. role 'pending' | 'tutor' | 'admin',
                             tutorId (set by an admin when linking), email, displayName
   tutors/{tutorId}          name, active, email (Google sign-in, lower case), linkedUid (null until linked)
   tutorRates/{tutorId}      hourlyRate, currency            ADMIN ONLY (tutors can't read)
   students/{studentId}      name, system ('UK' | 'US' | 'University'), yearGroup, contact, color, hourlyPrice, active   ADMIN ONLY
   settings/app              schoolName, timezone, dayStart, dayEnd, rooms[],
                             ccDeadline 'HH:mm' (day before the class), payTutorLateCC, defaultStudentPrice,
                             docName, docDetails (header of pay slips and receipts)
   dayNotes/{tutorId_date}   tutorId, date, text, updatedAt, updatedBy (admin writes; the tutor reads their own)
   personal/{id}             a tutor's own time: tutorId, date, startTime, endTime, title, seriesId (the tutor or an admin writes)
   payments/{kind_ref_month} kind 'tutor' | 'student', refId, month 'YYYY-MM', at, by, byName,
                             amount, minutes (what the slip or receipt said when it was ticked)   ADMIN ONLY

   classes/{classId}         the plan, written by admins only
     title, subject, qualification, yearGroup, examBoard, ccLog (who marked or removed a cancellation),
     date 'YYYY-MM-DD', startTime, endTime (Bangkok time), startAt, endAt,
     mode, meetingLink, room, tutorId, tutorName,
     studentIds[], studentNames{id: name}, studentColors{id: '#hex'}, adminChecklist{key: {done, by, byName, at}},
     cancellations{studentId: {at (when they told us), deadline, charge (true when late), by, byName, recordedAt}},
     materials[], seriesId, createdBy, createdAt, updatedAt

   classProgress/{classId}   the work, written by the class's tutor (or an admin)
     tutorId (copy used by the rules), status 'todo'|'in_progress'|'completed',
     attendance{studentId: {status, by, at}}, tutorChecklist{key: {...}},
     lessonNotes, updatedAt, updatedBy

   Admin and tutor data sit in separate documents because Firestore rules
   allow or deny whole documents, not single fields.

   In Firestore itself a class is ONE document, classes/{classId}: the plan
   fields plus a `progress` map (status, attendance, tutorChecklist,
   lessonNotes, updatedAt, updatedBy). The rules let the class's tutor change
   only `progress`. The Repo splits it back into classes + classProgress, so the
   rest of the app (and the Rules copy below) works with the two views above.
   Classes load by month (date range queries); a tutor's query also filters on
   tutorId, which needs the composite index in firestore.indexes.json.
   ========================================================================== */

/* ---------- Constants ---------- */
const TZ = 'Asia/Bangkok', TZ_OFFSET = '+07:00';
const DB_KEY = 'classPlanner.db.v3', UI_KEY = 'classPlanner.ui.v2', SCHEMA = 3;
const PPM = 1.1; // calendar pixels per minute
const MPPM = 0.9; // month calendar pixels per minute

/* Exam boards and their qualifications. `price` is the usual price per hour a student pays (THB);
   change it in Manage → Tutors and rates (saved as settings.levelPrices). */
const BOARDS = ['UK', 'US', 'University'];
const QUALS = [
  { id:'pre_igcse',  board:'UK',         label:'Pre-IGCSE',           note:'below Year 9', price:1200, color:'#3F88B8' },
  { id:'igcse',      board:'UK',         label:'IGCSE',               note:'',             price:1300, color:'#2B5F9E' },
  { id:'as_a_level', board:'UK',         label:'AS / A-level',        note:'',             price:1500, color:'#8A3A73' },
  { id:'my_6_7',     board:'US',         label:'Middle Years G6–7',   note:'Grade 6–7',    price:1200, color:'#2F8A57' },
  { id:'my_8_9',     board:'US',         label:'Middle Years G8–9',   note:'Grade 8–9',    price:1300, color:'#A87406' },
  { id:'ib_a_level', board:'US',         label:'IB / A-level G11–12', note:'Grade 11–12',  price:1500, color:'#B4532A' },
  { id:'university', board:'University', label:'University',          note:'',             price:null, color:'#5B4BA8' },
];
const QUAL_ALIAS = { gcse:'igcse', as_level:'as_a_level', a_level:'as_a_level' };   // older classes
const NO_QUAL = { id:'', board:'', label:'Level not set', note:'', price:null, color:'#7C879C' };
/* Student colours: rows of five, grouped like a palette chart. */
const PALETTE = [
  { group:'Qualitative', rows:[
    ['Pastel',   ['#FFC5D5', '#E4D5A7', '#A8E5C8', '#A5DCF0', '#E3C9F8']],
    ['Set',      ['#F096A8', '#C0AF50', '#50C389', '#2BBCDC', '#C79DE8']],
    ['Set 3',    ['#FFB4B7', '#D3CC82', '#7BDDB6', '#8BD3F4', '#E9B7F5']],
    ['Dark',     ['#C97B8C', '#A39148', '#44A372', '#2BA0B8', '#A986C6']],
    ['Dark 3',   ['#E66F88', '#AA9200', '#00AA5B', '#00A8D2', '#B672E0']],
    ['Warm',     ['#AFB164', '#CAA86F', '#DE9F87', '#E595A6', '#E192C5']],
    ['Cold',     ['#ACA6E4', '#7EB3E0', '#4ABDCD', '#3BC1AE', '#5DC08F']],
    ['Harmonic', ['#C8A86C', '#9CB66C', '#5CBE95', '#3EBDC2', '#7EB2E0']],
  ] },
  { group:'Sequential', rows:[
    ['Reds',     ['#6B0013', '#CF1F35', '#AC5859', '#FF7272', '#FFBDC2']],
    ['Oranges',  ['#7F2A08', '#D35100', '#F79120', '#F8D47C', '#FFCC9C']],
    ['Greens',   ['#004218', '#1B8A3F', '#5E8E6A', '#7AC584', '#C3E6C9']],
    ['Teals',    ['#0F5C66', '#208A85', '#00A99D', '#5FA9A0', '#A0D9C6']],
    ['Blues',    ['#003468', '#003EA1', '#006FB8', '#78ABE4', '#C3DBFF']],
    ['Purples',  ['#2E2172', '#3D2A93', '#6E5DBF', '#A79CE3', '#D8D0FB']],
    ['Magentas', ['#6D1B5E', '#A0407F', '#D9007A', '#E06FC2', '#F2C3D9']],
    ['Browns',   ['#6E2714', '#A0522D', '#BE7766', '#D7B290', '#8B7D5B']],
    ['Viridis',  ['#4D0055', '#005A8C', '#00A292', '#52CC66', '#FDE52E']],
    ['Plasma',   ['#001A8B', '#8E0091', '#D24B74', '#F0A100', '#D8FF4A']],
    ['Grays',    ['#1B1B1B', '#474747', '#6E6E6E', '#999999', '#CFCFCF']],
  ] },
];
/* Order used by "give colours": strong, well-separated colours first */
const AUTO_COLOURS = (() => {
  const rows = Object.fromEntries(PALETTE.flatMap(g => g.rows));
  const first = ['Dark 3', 'Set', 'Cold', 'Viridis', 'Plasma', 'Warm', 'Harmonic', 'Dark'];
  const out = [];
  for (let i = 0; i < 5; i++) for (const r of first) out.push(rows[r][i]);
  for (const i of [1, 2, 3, 0]) for (const r of ['Reds', 'Oranges', 'Greens', 'Teals', 'Blues', 'Purples', 'Magentas', 'Browns']) out.push(rows[r][i]);
  return [...new Set(out)];
})();
const NO_COLOUR = '#8C96A8';
const isHex = v => /^#[0-9a-f]{6}$/i.test(String(v || ''));
/* Used only when importing: below Year 9 Pre-IGCSE, Y9–11 IGCSE, Y12–13 AS / A-level */
const yearToQual = y => !y ? '' : y <= 8 ? 'pre_igcse' : y <= 11 ? 'igcse' : 'as_a_level';
/* Year groups per system: UK Year 5–13, US Grade 5–12, University Year 1–4 (stored as the number) */
const YEAR_RANGES = { UK:[5,6,7,8,9,10,11,12,13], US:[5,6,7,8,9,10,11,12], University:[1,2,3,4] };
const yearsFor = sys => YEAR_RANGES[sys] || YEAR_RANGES.UK;
const yearLabel = (sys, y) => !y ? '' : sys === 'US' ? `Grade ${y}` : sys === 'University' ? `Uni Year ${y}` : `Year ${y}`;
const stuSystem = s => BOARDS.includes(s?.system) ? s.system : 'UK';
const stuYear = s => yearLabel(stuSystem(s), s?.yearGroup);
/* the usual level for a system and year group (null when there isn't an obvious one) */
function suggestQual(sys, y) {
  if (sys === 'University') return 'university';
  if (!y) return null;
  if (sys === 'US') return y <= 7 ? 'my_6_7' : y <= 9 ? 'my_8_9' : y >= 11 ? 'ib_a_level' : null;
  return y <= 8 ? 'pre_igcse' : y <= 11 ? 'igcse' : 'as_a_level';
}
const SUBJECTS = ['Mathematics','Additional Mathematics','Further Mathematics','Physics','Chemistry','Biology','Combined Science','English Language','English Literature','English as a Second Language','Economics','Business','Accounting','Computer Science','Psychology','Geography','History','Thai','Chinese'];
const STATUSES = [
  { id:'todo',        label:'To-Do' },
  { id:'in_progress', label:'In Progress' },
  { id:'completed',   label:'Completed' },
];
const STATUS_IDS = STATUSES.map(s => s.id);
/* Checklists shown on each class. A group with no items is hidden everywhere.
   Switched off for now (put back here to show them again; saved ticks are kept):
   admin { key:'verifyPayment', label:'Verify payment' }
   tutor { key:'takeAttendance', label:'Take attendance' }, { key:'writeLessonNotes', label:'Write lesson notes' }, { key:'checkHomework', label:'Check homework' } */
const CHECKLISTS = {
  admin: [
    { key:'checkWorksheets', label:'Check worksheets' },
    { key:'sendClassLink',   label:'Send class link to students' },
  ],
  tutor: [],
};
const ATT = [
  { id:'present', label:'Present' },
  { id:'late',    label:'Late' },
  { id:'absent',  label:'Absent' },
  { id:'excused', label:'Excused' },
];
const PROGRESS_KEYS = ['status', 'attendance', 'tutorChecklist', 'lessonNotes', 'updatedAt', 'updatedBy', 'statusLog'];
const USER_CREATE_KEYS = ['email', 'displayName', 'photoURL', 'role', 'tutorId', 'createdAt', 'lastLoginAt'];
const DEFAULT_SETTINGS = { schoolName:'Class Planner', timezone:TZ, dayStart:'07:00', dayEnd:'23:00', rooms:[], ccDeadline:'20:00', payTutorLateCC:true, defaultStudentPrice:null, docName:'Morpheus', docDetails:'' };
/* Sign-in accounts and their passwords live in ACCESS (see Vault) until Firebase Authentication is connected. */

/* ---------- Small helpers ---------- */

function inRange(c, r) {

  if (r?.startsWith('m:')) return c.date.slice(0, 7) === r.slice(2);

}

const BILL_KIND = { taught:'Taught', late:'Late cancellation (charged)', credit:'Cancelled in time (credit kept)', open:'Not completed yet' };

function monthBill(month) {
  const by = {};
  for (const c of Repo.classes().filter(x => x.date.slice(0, 7) === month).sort(byStart)) for (const sid of c.studentIds) {
    const s = Repo.student(sid), r = ccOf(c, sid), mins = classMinutes(c), subject = c.subject || 'Other';
    const kind = c.tutorCancel ? 'credit' : r ? (r.charge ? 'late' : 'credit') : c.status === 'completed' ? 'taught' : 'open';
    const { price, special } = studentPrice(c, sid), charged = kind === 'taught' || kind === 'late', key = billKey(sid, subject);
    (by[key] ||= { key, ref:billRef(sid, subject), sid, subject, name:studentName(c, sid), year:stuYear(s) || null, color:s?.color || null, lines:[] })
      .lines.push({ c, r, mins, kind, byTutor:!!c.tutorCancel, charged, price, special, amount:charged && price != null ? mins / 60 * price : null });

    const s = Repo.student(x.sid);

/* ---------- Class actions ---------- */
/* Each status change is logged with who made it (kept on the class, last 20). Until the updated
   firestore.rules are published a tutor's change is saved without the log entry. */
const logEntry = extra => ({ ...extra, by:ui.auth.uid, byName:myName() || '', at:new Date().toISOString() });
async function saveStatuses(items) {   // items: [{ id, status, prev }]
  const logged = items.map(x => { const c = Repo.getClass(x.id); return { id:x.id, patch:{ status:x.status, statusLog:[...(c?.statusLog || []), logEntry({ from:x.prev, to:x.status })].slice(-20) } }; });
  if (!ui.statusLogBlocked) {
    try { await Repo.progressMany(logged); return { ok:true }; }
    catch (e) { if (!(e?.code === 'permission-denied' && !isAdmin())) return run(() => { throw e; }); ui.statusLogBlocked = true; }
  }
  return run(() => Repo.progressMany(items.map(x => ({ id:x.id, patch:{ status:x.status } }))));
}
const saveStatus = (id, status, prev) => saveStatuses([{ id, status, prev }]);
/* Board: move every selected class at once (a tutor can move their own) */
async function bulkMove(status) {
  const label = STATUSES.find(x => x.id === status).label;
  const list = [...ui.selected].map(id => Repo.getClass(id)).filter(c => c && can('class.move', c));
  const todo = list.filter(c => c.status !== status).sort(byStart);
  if (!todo.length) { toast(list.length ? `Those classes are already in ${label}.` : 'Select some classes first.', { tone:'warn' }); return; }
  const names = todo.slice(0, 4).map(c => `${fmtD(c.date, { day:'numeric', month:'short' })} ${hm(c.startTime)} ${c.title}`).join('; ');
  const ok = await confirmDialog({ title:`Move ${plural(todo.length, 'class', 'classes')} to ${label}?`, body:`${names}${todo.length > 4 ? `; and ${todo.length - 4} more` : ''}. Each class records that you moved it.`, ok:`Move to ${label}` });
  if (!ok) return;
  const back = todo.map(c => ({ id:c.id, status:c.status, prev:status }));
  const r = await saveStatuses(todo.map(c => ({ id:c.id, status, prev:c.status })));
  if (!r.ok) return;
  ui.selected.clear(); ui.selectMode = false; renderMain();
  toast(`${plural(todo.length, 'class', 'classes')} moved to ${label}.`, { action:{ label:'Undo', fn:() => saveStatuses(back) } });
}
const ccLogWith = (c, entry) => ({ ccLog:[...(c.ccLog || []), logEntry(entry)].slice(-30) });
async function moveClass(id, status) {
  const c = Repo.getClass(id); if (!c || c.status === status || !STATUS_IDS.includes(status)) return;
  const prev = c.status;
  const r = await saveStatus(id, status, prev);
  if (!r.ok) return;
  const c2 = Repo.getClass(id);
  const open = openItems(c2, 'tutor').length + (isAdmin() ? openItems(c2, 'admin').length : 0);
  const label = STATUSES.find(s => s.id === status).label;
  const warn = status === 'completed' && open;
  toast(warn ? `Moved to Completed. ${plural(open, 'checklist item is', 'checklist items are')} still open.` : `Moved to ${label}.`,
    { tone:warn ? 'warn' : '', action:{ label:'Undo', fn:() => saveStatus(id, prev, status) } });
}
async function setAttendance(id, sid, status) {
  const c = Repo.getClass(id); if (!c) return;
  const cur = c.attendance?.[sid]?.status;
  const r = await run(() => Repo.updateProgress(id, { [`attendance.${sid}`]: cur === status ? undefined : { status, by:ui.auth.uid, at:new Date().toISOString() } }));

  for (const sid of activeIds(c)) if (!c.attendance?.[sid]?.status) patch[`attendance.${sid}`] = { status:'present', by:ui.auth.uid, at };
  if (!Object.keys(patch).length) return;

}

function setAvail(box, html) { if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; } }
function renderAvail() {

async function submitClassForm() {

async function onEntityChange(el) {

  if (field === 'hourlyPrice') {
    v = String(v).trim() === '' ? null : Number(v);
    if (v != null && (!Number.isFinite(v) || v < 0)) { toast('Enter the price per hour in baht, for example 900.', { tone:'warn' }); renderManage(); return; }
    if (v != null) v = Math.round(v);
  }
  if (field === 'name') {
    v = v.trim(); if (!v) { toast('A name can’t be empty.', { tone:'warn' }); renderManage(); return; }
    const dup = entity === 'student' && sameName(v, id);

  }
  if (entity === 'tutor') {
    const before = Repo.tutor(id);
    const r = await run(() => Repo.saveTutor({ id, [field]:v }));
    if (!r.ok) { renderManage(); return; }
    if (field === 'active' && !v) {

    }
  } else {
    const patch = { [field]:v };
    if (field === 'system') { const s = Repo.student(id); if (s?.yearGroup && !yearsFor(v).includes(s.yearGroup)) patch.yearGroup = null; }   // a year that doesn't exist in the new system

}

  if (kind === 'add-account') {

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Enter a full email address.', { tone:'warn' }); return; }
    if (pw.length < 8) { toast('Make the first password at least 8 characters.', { tone:'warn' }); return; }
    busy('aa-go', 'Creating…');
    let uid;
    try { uid = await Cloud.createAccount(email, pw, name); }
    catch (e) { toast(e.code === 'auth/email-already-in-use' ? 'An account with this email already exists. If it’s in the list above, choose its access there.' : authMessage(e), { tone:'warn' }); renderManage(); return; }
    const r = await run(() => Repo.addProfile(uid, { email, displayName:name, access }));

  }
  if (kind === 'sign-in') {

    if (!(await Vault.signIn(uid, pw))) { ui.signInError = 'That password isn’t right. Check it and try again.'; return showSignIn(); }
    ui.signInFor = null; ui.signInError = '';
    return openSavedData(uid, true);
  }
  if (kind === 'open-old') {
    const pw = String(fd.get('password') || '');
    if (!cleanPw(pw)) { ui.signInError = 'Enter the shared password.'; return showSignIn(); }
    const btn = $('#old-go'); btn.disabled = true; btn.textContent = 'Opening…';
    try { const saved = await Vault.openOld(ui.oldRec, pw); ui.oldRec = null; ui.signInError = ''; return startApp(saved, ui.pendingSignIn.uid, ui.pendingSignIn.fresh); }
    catch { ui.signInError = 'That password doesn’t open the saved data.'; return showSignIn(); }
  }
  if (kind === 'set-password') {
    const uid = String(fd.get('uid') || ''), mine = String(fd.get('mine') || ''), next = cleanPw(fd.get('next')), again = cleanPw(fd.get('again'));
    const name = Vault.account(uid)?.displayName || 'this account';
    if (!isAdmin()) { toast('Only an admin can set passwords.', { tone:'warn' }); return; }
    if (!cleanPw(mine)) { toast('Type your own password to confirm it’s you.', { tone:'warn' }); return; }
    if (next.length < 10) { toast('Make the new password at least 10 characters.', { tone:'warn' }); return; }
    if (next !== again) { toast('The two new passwords don’t match.', { tone:'warn' }); return; }
    if (!/^https?:$/.test(location.protocol)) { toast('Open the app from its web address (Vercel) to set passwords.', { tone:'warn' }); return; }
    const btn = $('#pw-go'); btn.disabled = true; btn.textContent = 'Making the file…';
    try {
      const html = await (await fetch(location.href.split('#')[0], { cache:'no-store' })).text();
      const re = /const ACCESS = \{[^\n]*\};/;
      if (!re.test(html)) throw new Error('Couldn’t read this app’s file. Reload the page and try again.');
      const block = await Vault.setPassword(uid, next, mine);
      downloadFile('index.html', html.replace(re, () => `const ACCESS = ${JSON.stringify(block)};`), 'text/html;charset=utf-8');
      refreshManage();
      toast(`New index.html downloaded with ${name}’s new password. Upload it to Vercel, then tell ${name} the password.`);
    } catch (e) {
      toast(e.message || 'Couldn’t make the new file.', { tone:'warn' });
      const b = $('#pw-go'); if (b) { b.disabled = false; b.textContent = 'Make new app file'; }

  }
  if (kind === 'material') return addMaterial(form);
  if (kind === 'add-tutor') {
    const name = String(fd.get('name') || '').trim(), rateRaw = String(fd.get('rate') || '').trim(), email = String(fd.get('email') || '').trim().toLowerCase();
    if (!name) { toast('Type the tutor’s name first.', { tone:'warn' }); return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Enter a full email address, or leave it empty.', { tone:'warn' }); return; }
    if (email && Repo.tutors().some(x => x.email === email)) { toast('Another tutor already uses that email.', { tone:'warn' }); return; }
    const r = await run(() => Repo.saveTutor({ name, email }));
    if (!r.ok) return;
    const num = x => x !== '' && Number(x) >= 0 ? Math.round(Number(x)) : null;
    if (num(rateRaw) != null) await run(() => Repo.saveRates(r.value, { hourlyRate:num(rateRaw) }));
    const waiting = email && Repo.users().find(x => (x.email || '').toLowerCase() === email && x.role === 'pending');
    if (waiting) await run(() => Repo.setAccess(waiting.id, `tutor:${r.value}`));

    const name = String(fd.get('name') || '').trim();

    const dup = sameName(name);

    }));
    if (r.ok) toast('Settings saved.');
  }
}

/* ---------- Data: export / import / reset ---------- */
async function exportData() {
  if (CLOUD) { toast('Collecting every class…'); await Repo.loadAll(); }

  const blob = new Blob([r.value], { type:'application/json' });

async function onImportFile(e) {
  const file = e.target.files?.[0]; e.target.value = '';

  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('That file couldn’t be read as JSON.', { tone:'warn' }); return; }

/* ---------- Toasts and confirm ---------- */
function toast(msg, opts = {}) {
  const root = $('#toasts'), el = document.createElement('div');
  el.className = 'toast' + (opts.tone ? ' ' + opts.tone : ''); el.setAttribute('role', 'status');
  const span = document.createElement('span'); span.textContent = msg; el.append(span);
  if (opts.action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = opts.action.label;
    b.addEventListener('click', () => { opts.action.fn(); el.remove(); });
    el.append(b);
  }
  root.append(el);
  while (root.children.length > 3) root.firstElementChild.remove();
  setTimeout(() => el.remove(), opts.action ? 7000 : 3600);
}
function confirmDialog({ title, body, ok = 'Confirm', danger = false }) {
  return new Promise(resolve => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="modal-back confirm-back"><div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="cd-t" aria-describedby="cd-b">
      <div class="modal-body"><h2 id="cd-t" class="h-sm">${esc(title)}</h2><p id="cd-b">${esc(body)}</p></div>
      <div class="modal-foot"><button type="button" class="btn" id="cd-no">Cancel</button><button type="button" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" id="cd-yes">${esc(ok)}</button></div>
    </div></div>`;
    const done = v => { root.innerHTML = ''; ui.confirmResolve = null; resolve(v); };
    ui.confirmResolve = done;
    $('#cd-no').addEventListener('click', () => done(false));
    $('#cd-yes').addEventListener('click', () => done(true));
    $('#cd-yes').focus();
  });
}

  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function onKeydown(e) {
  const t = e.target;
  if (t.id === 'cf-new-name' && fs && e.key === 'Enter') { e.preventDefault(); createNewStudent(); return; }
  if (e.key === 'Escape') {
    if (ui.confirmResolve) return ui.confirmResolve(false);
    if (ui.doc) return closeDoc();
    if (ui.popFor) return closePop(true);
    if ($('#modal-root').innerHTML) return closeModal();
    if (ui.openClassId) return closeDrawer();
    const open = $('details.menu[open]'); if (open) { open.open = false; open.querySelector('summary').focus(); return; }
    if (ui.selectMode) { ui.selectMode = false; ui.selected.clear(); renderMain(); }
    return;
  }
  if (e.key === 'Tab') return trapTab(e);
  if ((e.key === 'Enter' || e.key === ' ') && t.classList?.contains('card')) {
    e.preventDefault();
    if (ui.selectMode) actions['toggle-select'](t); else openDrawer(t.dataset.id);
  }
}
function bindDnD() {
  document.addEventListener('dragstart', e => {
    const card = e.target.closest?.('.card[draggable="true"]'); if (!card) return;
    ui.dragging = card.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.id);
    requestAnimationFrame(() => card.classList.add('dragging'));
  });
  document.addEventListener('dragend', () => {
    ui.dragging = null;
    $$('.card.dragging').forEach(x => x.classList.remove('dragging'));
    $$('.col.drop-target').forEach(x => x.classList.remove('drop-target'));
  });
  document.addEventListener('dragover', e => {
    if (!ui.dragging) return;
    const col = e.target.closest?.('.col'); if (!col) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.col.drop-target').forEach(x => x !== col && x.classList.remove('drop-target'));
    col.classList.add('drop-target');
  });
  document.addEventListener('dragleave', e => {
    const col = e.target.closest?.('.col');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop-target');
  });
  document.addEventListener('drop', e => {
    if (!ui.dragging) return;
    const col = e.target.closest?.('.col'); if (!col) return;
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain') || ui.dragging;
    ui.dragging = null;
    $$('.col.drop-target').forEach(x => x.classList.remove('drop-target'));
    moveClass(id, col.dataset.status);
  });
}

    uid_aom:   { email:'aom.tutor@example.com', displayName:'Kru Aom',      photoURL:null, role:'tutor',   tutorId:'tutor_aom', createdAt:at('2026-09-28', '18:00'), lastLoginAt:nowIso },
    uid_oil:   { email:'oil.tutor@example.com', displayName:'Kru Oil',      photoURL:null, role:'tutor',   tutorId:'tutor_oil', createdAt:yesterday,                 lastLoginAt:yesterday },
    uid_tm:    { email:'tm.tutor@example.com',  displayName:'Kru TM',       photoURL:null, role:'tutor',   tutorId:'tutor_tm',  createdAt:yesterday,                 lastLoginAt:yesterday },
  };
  const students = Object.fromEntries(TIMETABLE.students.map(([id, name, yearGroup]) => [id, { name, yearGroup, contact:'', color:null, active:true }]));
  const TUTOR = {
    mo:  { id:'tutor_mo',  uid:'uid_mo',    subject:'Biology' },
    oil: { id:'tutor_oil', uid:'uid_oil',   subject:'Mathematics' },
    aom: { id:'tutor_aom', uid:'uid_aom',   subject:'Mathematics' },
  };
  const classes = {}, classProgress = {};
  TIMETABLE.classes.forEach(([t, md, s, e, ids, flags, note, code], i) => {
    const T = TUTOR[t], tutorName = tutors[T.id].name;
    const date = `${TIMETABLE.year}-${md}`, startTime = fromMin(s), endTime = fromMin(e), endAt = at(date, endTime);
    const years = [...new Set(ids.map(x => students[x].yearGroup))];
    const yearGroup = years.length === 1 ? years[0] : null;
    const past = Date.parse(endAt) < now, lateCancel = !!(flags & 2);
    const id = `cls_tt_${t}_${md.replace('-', '')}_${String(s).padStart(4, '0')}`;   // one class per tutor and start time, so re-imports can match it
    classes[id] = {
      title:ids.map(x => students[x].name).join(' and ') + (code ? ` (${code})` : ''),
      subject:T.subject, qualification:yearToQual(yearGroup), yearGroup, examBoard:'',
      date, startTime, endTime, startAt:at(date, startTime), endAt,
      mode:flags & 1 ? 'in_person' : 'online', meetingLink:'', room:'',
      tutorId:T.id, tutorName, studentIds:ids, studentNames:Object.fromEntries(ids.map(x => [x, students[x].name])), studentColors:{},
      cancellations:lateCancel ? Object.fromEntries(ids.map(x => [x, { at:at(date, startTime), charge:true, deadline:at(addDays(date, -1), DEFAULT_SETTINGS.ccDeadline), by:'import', byName:'Timetable import', recordedAt:at(date, startTime) }])) : {},
      adminChecklist:Object.fromEntries(CHECKLISTS.admin.map(x => [x.key, past && !(flags & 8) ? { done:true, by:'uid_admin', byName:'Office Admin', at:endAt } : { done:false }])),
      materials:[], seriesId:null, createdBy:'uid_admin', createdAt:at('2026-08-30', '09:00'), updatedAt:nowIso,
    };
    classProgress[id] = {
      tutorId:T.id, status:past ? 'completed' : 'todo',
      attendance:past && !lateCancel ? Object.fromEntries(ids.map(x => [x, { status:'present', by:T.uid, at:at(date, startTime) }])) : {},
      tutorChecklist:Object.fromEntries(CHECKLISTS.tutor.map(x => [x.key, past && !(flags & 4) ? { done:true, by:T.uid, byName:tutorName, at:endAt } : { done:false }])),
      lessonNotes:note ? `Timetable note: ${note}.` : '',
      updatedAt:nowIso, updatedBy:T.uid,
    };
  });
  return {
    schemaVersion:SCHEMA,
    settings:{ app:{ ...DEFAULT_SETTINGS } },
    users, tutors, tutorRates, students, classes, classProgress, payments:{}, dayNotes:{}, personal:{}, timetable:TIMETABLE.version,
  };
}

/* ---------- Start ---------- */
let lastMinute = -1;
function tickClock() {
  updateClock();
  const m = bkkNow().min;
  if (m !== lastMinute) { lastMinute = m; if (!ui.dragging) render(); }
}
async function init() {
  loadUI();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKeydown);
  document.addEventListener('focusout', e => {
    if (e.target.id === 'notes') flushNotes();
  });
  $('#import-file').addEventListener('change', onImportFile);
  bindDnD();
  if (CLOUD) return bootCloud();
  const uid = Vault.supported() ? await Vault.resume() : null;
  if (uid) await openSavedData(uid, false); else showSignIn();
}
/* After the password: open this browser's saved data, then start */
async function openSavedData(uid, fresh) {
  const local = await Vault.loadLocal();
  if (local.old) { ui.oldRec = local.old; ui.pendingSignIn = { uid, fresh }; return showSignIn(); }
  return startApp(local.db, uid, fresh);
}
let started = false;
function startOnce() {
  if (started) return;
  started = true;
  ui.cal.date = bkkNow().date; lastMinute = bkkNow().min;
  Repo.onChange(() => render());
  setInterval(tickClock, 15000);
}
/* With Firebase: connect, then follow the signed-in account */
async function bootCloud() {
  document.body.classList.add('cloud');
  Repo.blank(); ui.cloud = 'boot'; renderGate();
  try { Cloud = await connectCloud(); }
  catch (e) {
    console.error(e); ui.cloud = 'error';
    ui.cloudFail = location.protocol === 'file:' ? 'Open the app from its web address (Vercel). It can’t reach Firebase when opened as a file.' : 'Couldn’t load Firebase. Check the internet connection, then try again.';
    return renderGate();
  }
  Cloud.get('meta/public').then(p => { ui.setupOpen = !p; ui.rulesMissing = false; ui.lastScreen = ''; if (ui.cloud === 'out') renderGate(); })
    .catch(e => { ui.rulesMissing = e?.code === 'permission-denied'; ui.lastScreen = ''; if (ui.cloud === 'out') renderGate(); });
  Cloud.onAuth(user => onCloudAuth(user));
}
function onCloudAuth(user) {
  Repo.disconnect(); closeOverlays();
  if (!user) { ui.auth = null; ui.cloud = 'out'; ui.lastScreen = ''; return renderGate(); }
  ui.auth = { uid:user.uid, email:user.email, displayName:user.displayName || user.email.split('@')[0] };
  ui.cloud = 'loading'; ui.lastScreen = ''; renderGate(); startOnce();
  Repo.connect(ui.auth, (status, err) => {
    ui.cloud = status; ui.cloudFail = err ? (err.code === 'permission-denied' ? 'Firebase refused to load your data. Ask the office to check the rules (firestore.rules) are published.' : err.message || String(err)) : null;
    ui.lastScreen = '';
    if (status === 'ready') {
      const p = Repo.profile();
      if (p?.displayName) ui.auth.displayName = p.displayName;
      render();
      if (isAdmin() && !ui.toldPending) {
        ui.toldPending = true;
        const n = Repo.users().filter(u => u.role === 'pending').length;
        if (n) toast(`${plural(n, 'account is', 'accounts are')} waiting for access.`, { action:{ label:'Review', fn:() => openManage('accounts') } });
      }
    } else renderGate();
  });
}
async function startApp(saved, uid, fresh) {
  const added = Repo.init(saved);
  if (!started) {
    started = true;
    ui.cal.date = bkkNow().date; lastMinute = bkkNow().min;
    Repo.onChange(() => render());
    setInterval(tickClock, 15000);
  }
  const a = Vault.account(uid);
  ui.auth = { uid, email:a.email, displayName:a.displayName };
  const r = await run(() => Repo.ensureProfile());
  ui.lastScreen = ''; render();
  if (r.ok && added && isAdmin()) toast(`The timetable inside the app is newer: ${plural(added, 'class', 'classes')} added. Classes already here kept everything recorded on them.`, { action:{ label:'Open calendar', fn:() => { ui.view = 'calendar'; saveUI(); render(); } } });
  if (r.ok && fresh && isAdmin()) {
    const n = Repo.users().filter(u => u.role === 'pending').length;
    if (n) toast(`${plural(n, 'account is', 'accounts are')} waiting to be linked to a tutor.`, { action:{ label:'Review', fn:() => openManage('accounts') } });
  }
}
init();
</script>
